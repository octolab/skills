version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: inventory'
      - 'scope: deps'
    commit-message:
      prefix: 'ci/cd'
      include: 'scope'

  - package-ecosystem: npm
    directory: /docs/
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: docs'
      - 'scope: deps'
    commit-message:
      prefix: 'docs'
      include: 'scope'
